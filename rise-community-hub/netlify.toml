[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
[build]
  command = "next build"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"